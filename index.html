<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DJI Goggles 3 - FPV Stadium Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; position: fixed; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* DJI Goggles 3 OSD Overlay Style */
        #osd-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; pointer-events: none; color: #ffffff; font-family: monospace;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Center Crosshair */
        #osd-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none;
        }
        #osd-crosshair::before, #osd-crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
        }
        #osd-crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #osd-crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        /* Bottom Left: Flight Mode Box + Telemetry */
        #osd-bottom-left {
            position: absolute; bottom: 25px; left: 30px;
            display: flex; align-items: flex-end; gap: 12px;
        }
        #osd-mode-box {
            background: #ffffff; color: #000000; font-weight: 900; font-size: 22px;
            padding: 4px 12px; border-radius: 4px; letter-spacing: 1px; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        #osd-telemetry-grid {
            display: grid; grid-template-columns: auto auto; column-gap: 16px; row-gap: 2px;
            font-size: 14px; font-weight: bold; align-items: center; padding-bottom: 2px;
        }
        .tele-item span { font-weight: normal; opacity: 0.8; margin-right: 2px; }

        /* Bottom Right: Icons */
        #osd-bottom-right {
            position: absolute; bottom: 25px; right: 30px;
            display: flex; align-items: center; gap: 14px; font-size: 18px; opacity: 0.9;
        }

        /* Top Right: FPS and _M_ format indicator */
        #osd-top-right {
            position: absolute; top: 20px; right: 30px;
            display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: bold; pointer-events: auto;
        }
        .top-btn {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); padding: 5px 10px;
            border-radius: 4px; cursor: pointer; color: #fff; font-family: monospace;
        }
        .top-btn:hover { background: rgba(255,255,255,0.2); }

        /* RC Stick Overlay (Bottom Corners) */
        .rc-stick-display {
            position: absolute; bottom: 20px; width: 90px; height: 90px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 5;
        }
        #rc-left { left: 160px; }
        #rc-right { right: 160px; }
        .rc-gimbal-dot {
            width: 14px; height: 14px; background: #ffcc00; border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.8); position: absolute;
            transform: translate(0px, 0px); transition: transform 0.05s linear;
        }

        /* Touch Joysticks (Mobile Control Overlay) */
        #touch-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 9; pointer-events: none; display: none;
        }
        .touch-pad {
            position: absolute; bottom: 20px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.04); border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; pointer-events: auto; touch-action: none;
        }
        #touch-left-pad { left: 30px; }
        #touch-right-pad { right: 30px; }
        .touch-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        /* HOME / SETTINGS MENU MODAL */
        #home-menu {
            position: absolute; width: 100%; height: 100%; background: rgba(10, 15, 25, 0.88);
            color: #ffffff; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; z-index: 20; backdrop-filter: blur(8px);
        }
        .menu-card {
            background: rgba(25, 32, 45, 0.95); padding: 30px 40px; border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.7); max-width: 480px; width: 90%;
        }
        h1 { margin-bottom: 8px; font-size: 22px; letter-spacing: 1px; color: #ffcc00; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 25px; }
        
        .menu-section { margin-bottom: 20px; text-align: left; }
        .menu-section label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        .mode-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;
            padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s;
        }
        .mode-btn.active { background: #ffcc00; color: #000; border-color: #ffcc00; }

        .graphic-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .graphic-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;
            padding: 8px 4px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; text-align: center;
        }
        .graphic-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

        .start-btn {
            width: 100%; background: linear-gradient(135deg, #ffcc00, #ff9900); color: #000;
            border: none; padding: 14px; border-radius: 6px; font-size: 15px; font-weight: bold;
            cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(255,204,0,0.3); transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.98); }
        .controls-hint { margin-top: 15px; font-size: 11px; color: #777; line-height: 1.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- HOME / SETTINGS SCREEN -->
    <div id="home-menu">
        <div class="menu-card">
            <h1>DJI Goggles 3 Simulator</h1>
            <div class="subtitle">FPV Stadium Drone Experience</div>

            <div class="menu-section">
                <label>Control Mode</label>
                <div class="mode-select-grid">
                    <button class="mode-btn active" id="btn-mode-desktop" onclick="setControlMode('desktop')">💻 Desktop Mode</button>
                    <button class="mode-btn" id="btn-mode-mobile" onclick="setControlMode('mobile')">📱 Mobile Mode</button>
                </div>
            </div>

            <div class="menu-section">
                <label>Graphics Preset (Press 'O' in-game)</label>
                <div class="graphic-select-grid">
                    <button class="graphic-btn" id="gfx-low" onclick="setGraphics('low')">Low</button>
                    <button class="graphic-btn active" id="gfx-medium" onclick="setGraphics('medium')">Medium</button>
                    <button class="graphic-btn" id="gfx-high" onclick="setGraphics('high')">High</button>
                    <button class="graphic-btn" id="gfx-ultra" onclick="setGraphics('ultra')">Ultra</button>
                </div>
            </div>

            <button class="start-btn" onclick="launchSimulator()">START FLIGHT</button>

            <div class="controls-hint" id="hint-text">
                <b>Desktop Controls:</b> W/S Throttle, A/D Yaw, Mouse Pitch/Roll, R Reset, O Settings
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <!-- DJI Goggles 3 OSD Layout -->
        <div id="osd-overlay">
            <div id="osd-crosshair"></div>

            <div id="osd-top-right">
                <div id="osd-fps">60 FPS</div>
                <div id="osd-mode-format" style="color: #ffcc00;">_M_</div>
                <button class="top-btn" onclick="openSettings()">⚙ Settings</button>
            </div>

            <div id="osd-bottom-left">
                <div id="osd-mode-box">M</div>
                <div id="osd-telemetry-grid">
                    <div class="tele-item" id="tele-speed">0.0km/h</div>
                    <div class="tele-item" id="tele-speed2">0.0km/h</div>
                    <div class="tele-item" id="tele-height"><span>H</span> 0.0m</div>
                    <div class="tele-item" id="tele-dist"><span>D</span> -- m</div>
                </div>
            </div>

            <div id="osd-bottom-right">
                <div>🥽</div>
                <div>🎮</div>
            </div>

            <!-- RC Stick Live Visualizers -->
            <div class="rc-stick-display" id="rc-left">
                <div class="rc-gimbal-dot" id="dot-left"></div>
            </div>
            <div class="rc-stick-display" id="rc-right">
                <div class="rc-gimbal-dot" id="dot-right"></div>
            </div>
        </div>

        <!-- Touch Joysticks (Active in Mobile Mode) -->
        <div id="touch-controls">
            <div id="touch-left-pad" class="touch-pad">
                <div id="touch-left-knob" class="touch-knob"></div>
            </div>
            <div id="touch-right-pad" class="touch-pad">
                <div id="touch-right-knob" class="touch-knob"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedControlMode = 'desktop';
        let selectedGraphics = 'medium';

        function setControlMode(mode) {
            selectedControlMode = mode;
            document.getElementById('btn-mode-desktop').classList.toggle('active', mode === 'desktop');
            document.getElementById('btn-mode-mobile').classList.toggle('active', mode === 'mobile');
            document.getElementById('hint-text').innerHTML = mode === 'desktop' ? 
                '<b>Desktop Controls:</b> W/S Throttle, A/D Yaw, Mouse Pitch/Roll, R Reset, O Settings' :
                '<b>Mobile Controls:</b> Left Stick (Throttle/Yaw), Right Stick (Pitch/Roll), O Settings';
        }

        function setGraphics(preset) {
            selectedGraphics = preset;
            ['low', 'medium', 'high', 'ultra'].forEach(p => {
                document.getElementById('gfx-' + p).classList.toggle('active', p === preset);
            });
            applyGraphicsSettings();
        }

        function openSettings() {
            document.getElementById('home-menu').style.display = 'flex';
            if (!isMobileDevice && document.pointerLockElement) {
                document.exitPointerLock();
            }
        }

        const isMobileDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobileDevice) {
            setControlMode('mobile');
        }

        // --- WEB AUDIO MOTOR SOUND ENGINE ---
        let audioCtx = null, motorOsc = null, motorGain = null, noiseNode = null, noiseGain = null, isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioCtx = new AudioContext();

            motorOsc = audioCtx.createOscillator();
            motorOsc.type = 'sawtooth';
            motorOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

            motorGain = audioCtx.createGain();
            motorGain.gain.setValueAtTime(0.0, audioCtx.currentTime);

            motorOsc.connect(motorGain);
            motorGain.connect(audioCtx.destination);
            motorOsc.start();

            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);

            noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.0, audioCtx.currentTime);

            noiseNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();

            isAudioInitialized = true;
        }

        function updateAudioEngine(throttle) {
            if (!isAudioInitialized || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            motorGain.gain.setTargetAtTime(0.015 + throttle * 0.12, audioCtx.currentTime, 0.05);
            motorOsc.frequency.setTargetAtTime(55 + throttle * 130, audioCtx.currentTime, 0.05);
            noiseGain.gain.setTargetAtTime(throttle * 0.06, audioCtx.currentTime, 0.05);
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x90b5ff);
        scene.fog = new THREE.FogExp2(0xbcd6ff, 0.0012);

        const camera = new THREE.PerspectiveCamera(110, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        function applyGraphicsSettings() {
            if (!renderer) return;
            switch(selectedGraphics) {
                case 'low':
                    renderer.setPixelRatio(1);
                    renderer.shadowMap.enabled = false;
                    scene.fog.density = 0.002;
                    break;
                case 'medium':
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                    renderer.shadowMap.enabled = true;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                    scene.fog.density = 0.0012;
                    break;
                case 'high':
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.shadowMap.enabled = true;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                    scene.fog.density = 0.0008;
                    break;
                case 'ultra':
                    renderer.setPixelRatio(window.devicePixelRatio);
                    renderer.shadowMap.enabled = true;
                    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                    scene.fog.density = 0.0005;
                    break;
            }
        }
        applyGraphicsSettings();

        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleResize);

        // --- LIGHTS & REALISTIC SHADOWS ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sunLight = new THREE.DirectionalLight(0xfffae0, 0.9);
        sunLight.position.set(150, 350, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 1000;
        const d = 150;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // --- REALISTIC STADIUM ENVIRONMENT ---
        const turfCanvas = document.createElement('canvas');
        turfCanvas.width = 512; turfCanvas.height = 512;
        const ctxTurf = turfCanvas.getContext('2d');
        ctxTurf.fillStyle = '#417c34'; ctxTurf.fillRect(0, 0, 512, 512);
        for(let i=0; i<10; i++) {
            if(i % 2 === 0) { ctxTurf.fillStyle = 'rgba(0,0,0,0.08)'; ctxTurf.fillRect(0, i * 51.2, 512, 51.2); }
        }
        const turfTex = new THREE.CanvasTexture(turfCanvas);
        turfTex.wrapS = THREE.RepeatWrapping; turfTex.wrapT = THREE.RepeatWrapping; turfTex.repeat.set(1, 2);

        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(90, 140), new THREE.MeshStandardMaterial({ map: turfTex, roughness: 0.8 }));
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        const track = new THREE.Mesh(new THREE.RingGeometry(48, 70, 48), new THREE.MeshStandardMaterial({ color: 0x9e3f3f, roughness: 0.7 }));
        track.rotation.x = -Math.PI / 2;
        track.position.y = 0.04;
        track.receiveShadow = true;
        scene.add(track);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.9 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.1;
        floor.receiveShadow = true;
        scene.add(floor);

        const obstacles = [];
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x555c66, roughness: 0.5 });
        const trussMat = new THREE.MeshStandardMaterial({ color: 0x1f242b, metalness: 0.8, roughness: 0.2 });

        function createStadiumStand(x, z, rotY, w, d) {
            const standGroup = new THREE.Group();
            const steps = 12;
            for(let i=0; i<steps; i++) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(w, 2.2, d / steps), wallMat);
                box.position.set(0, i * 1.6, (i - steps/2) * (d / steps));
                box.castShadow = true; box.receiveShadow = true;
                standGroup.add(box);
            }
            const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 12, 1.8, d + 18), trussMat);
            roof.position.set(0, steps * 1.6 + 6, 0);
            roof.rotation.x = 0.22;
            roof.castShadow = true; roof.receiveShadow = true;
            standGroup.add(roof);
            
            standGroup.position.set(x, 0, z);
            standGroup.rotation.y = rotY;
            scene.add(standGroup);
            obstacles.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2, minY: 0, maxY: steps * 1.6 + 12 });
        }
        createStadiumStand(0, -80, 0, 120, 50);
        createStadiumStand(0, 80, Math.PI, 120, 50);
        createStadiumStand(-65, 0, Math.PI / 2, 120, 50);
        createStadiumStand(65, 0, -Math.PI / 2, 120, 50);

        // --- DRONE MODEL ---
        const droneGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1c1e22, roughness: 0.3 });
        const orangeAccent = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.2 });
        const propMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.1 });

        const fuselage = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.6), bodyMat);
        fuselage.castShadow = true;
        droneGroup.add(fuselage);

        const propMeshes = [];
        [{ x: 0.95, z: 0.85 }, { x: -0.95, z: 0.85 }, { x: 0.95, z: -0.85 }, { x: -0.95, z: -0.85 }].forEach(pos => {
            const duct = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.4, 16, 1, true), bodyMat);
            duct.position.set(pos.x, 0, pos.z);
            duct.castShadow = true;
            droneGroup.add(duct);
            const prop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.03, 0.18), propMat);
            prop.position.set(pos.x, 0, pos.z);
            droneGroup.add(prop);
            propMeshes.push(prop);
        });
        scene.add(droneGroup);

        const drone = {
            position: new THREE.Vector3(0, 5, 45),
            velocity: new THREE.Vector3(0, 0, 0),
            rotation: new THREE.Quaternion(),
            euler: new THREE.Euler(0, 0, 0, 'YXZ')
        };

        const MODES = {
            1: { code: "N", formatText: "_N_", maxThrust: 14.0, drag: 0.040, hasAutoLevel: true, maxAngle: 0.45 },
            2: { code: "S", formatText: "_S_", maxThrust: 21.0, drag: 0.025, hasAutoLevel: true, maxAngle: 0.75 },
            3: { code: "M", formatText: "_M_", maxThrust: 25.5, drag: 0.020, hasAutoLevel: false },
            4: { code: "A", formatText: "_A_", maxThrust: 25.5, drag: 0.008, hasAutoLevel: false }
        };
        let activeMode = 3;

        let keys = { w: false, s: false, a: false, d: false };
        let mouseRoll = 0, mousePitch = 0;
        let touchLeftValX = 0, touchLeftValY = 0, touchRightValX = 0, touchRightValY = 0;
        let currentThrottle = 0;

        function launchSimulator() {
            initAudio();
            handleResize();
            document.getElementById('home-menu').style.display = 'none';

            if (selectedControlMode === 'desktop' && !isMobileDevice) {
                container.requestPointerLock();
                document.getElementById('touch-controls').style.display = 'none';
            } else {
                document.getElementById('touch-controls').style.display = 'block';
            }
        }

        document.addEventListener('pointerlockchange', () => {
            if (!isMobileDevice && selectedControlMode === 'desktop') {
                const isLocked = (document.pointerLockElement === container);
                if (!isLocked) document.getElementById('home-menu').style.display = 'flex';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'o') { openSettings(); return; }
            if (['1','2','3','4'].includes(e.key)) {
                activeMode = parseInt(e.key);
                document.getElementById('osd-mode-box').innerText = MODES[activeMode].code;
                document.getElementById('osd-mode-format').innerText = MODES[activeMode].formatText;
                return;
            }
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === 'r') resetDrone();
        });
        document.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if (key in keys) keys[key] = false; });
        document.addEventListener('mousemove', (e) => {
            if (selectedControlMode === 'mobile' || document.pointerLockElement !== container) return;
            mouseRoll = e.movementX * 0.0025;
            mousePitch = -e.movementY * 0.0025;
        });

        function setupTouchJoystick(padId, knobId, callback) {
            const pad = document.getElementById(padId);
            const knob = document.getElementById(knobId);
            let activeTouchId = null;
            pad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId === null) { activeTouchId = e.changedTouches[0].identifier; updateStick(e.changedTouches[0]); }
            }, { passive: false });
            pad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) updateStick(e.changedTouches[i]);
                }
            }, { passive: false });
            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null; knob.style.transform = `translate(-50%, -50%)`; callback(0, 0);
                    }
                }
            };
            pad.addEventListener('touchend', endTouch);
            pad.addEventListener('touchcancel', endTouch);
            function updateStick(touch) {
                const rect = pad.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 42) { dx = (dx / dist) * 42; dy = (dy / dist) * 42; }
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                callback(dx / 42, dy / 42);
            }
        }

        setupTouchJoystick('touch-left-pad', 'touch-left-knob', (x, y) => { touchLeftValX = x; touchLeftValY = y; });
        setupTouchJoystick('touch-right-pad', 'touch-right-knob', (x, y) => { touchRightValX = x; touchRightValY = y; });

        function resetDrone() {
            drone.position.set(0, 5, 45); drone.velocity.set(0, 0, 0); drone.rotation.set(0, 0, 0, 1); drone.euler.set(0, 0, 0);
            currentThrottle = 0;
        }

        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastFpsUpdate = 0;

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta(); if (dt > 0.1) dt = 0.1;
            
            frameCount++;
            const now = clock.getElapsedTime();
            if (now - lastFpsUpdate >= 0.5) {
                const currentFps = Math.round(frameCount / (now - lastFpsUpdate));
                document.getElementById('osd-fps').innerText = `${currentFps} FPS`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            const modeCfg = MODES[activeMode];
            let inputYaw = 0;
            let stickLeftX = 0, stickLeftY = 0, stickRightX = 0, stickRightY = 0;

            if (selectedControlMode === 'mobile' || isMobileDevice) {
                currentThrottle = (-touchLeftValY + 1) / 2;
                inputYaw = touchLeftValX * 3.5 * dt;
                stickLeftX = touchLeftValX; stickLeftY = touchLeftValY;

                const targetPitch = -touchRightValY * modeCfg.maxAngle;
                const targetRoll = touchRightValX * modeCfg.maxAngle;
                stickRightX = touchRightValX; stickRightY = touchRightValY;

                if (modeCfg.hasAutoLevel) {
                    drone.euler.y -= inputYaw;
                    drone.euler.x = targetPitch;
                    drone.euler.z = targetRoll;
                    drone.rotation.setFromEuler(drone.euler);
                } else {
                    drone.rotation.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-touchRightValY * 2.0 * dt, -inputYaw, -touchRightValX * 2.0 * dt, 'YXZ'))).normalize();
                }
            } else {
                if (document.pointerLockElement === container) {
                    if (keys.w) currentThrottle = Math.min(1.0, currentThrottle + 4.0 * dt);
                    if (keys.s) currentThrottle = Math.max(0.0, currentThrottle - 4.0 * dt);
                    if (keys.a) inputYaw = -3.5 * dt;
                    if (keys.d) inputYaw = 3.5 * dt;

                    stickLeftX = inputYaw !== 0 ? (inputYaw > 0 ? 0.8 : -0.8) : 0;
                    stickLeftY = -(currentThrottle * 2 - 1);

                    stickRightX = mouseRoll / 0.0025 / 15;
                    stickRightY = -mousePitch / 0.0025 / 15;

                    if (modeCfg.hasAutoLevel) {
                        drone.euler.y -= inputYaw;
                        drone.euler.x = THREE.MathUtils.clamp(drone.euler.x + mousePitch, -modeCfg.maxAngle, modeCfg.maxAngle);
                        drone.euler.z = THREE.MathUtils.clamp(drone.euler.z - mouseRoll, -modeCfg.maxAngle, modeCfg.maxAngle);
                        if (Math.abs(mousePitch) < 0.001) drone.euler.x *= Math.exp(-6.0 * dt);
                        if (Math.abs(mouseRoll) < 0.001) drone.euler.z *= Math.exp(-6.0 * dt);
                        drone.rotation.setFromEuler(drone.euler);
                    } else {
                        drone.rotation.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(mousePitch, -inputYaw, -mouseRoll, 'YXZ'))).normalize();
                    }
                }
            }

            // Update RC Stick Overlay Gimbals
            document.getElementById('dot-left').style.transform = `translate(${stickLeftX * 32}px, ${stickLeftY * 32}px)`;
            document.getElementById('dot-right').style.transform = `translate(${stickRightX * 32}px, ${stickRightY * 32}px)`;

            updateAudioEngine(currentThrottle);

            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(drone.rotation);
            const thrust = localUp.multiplyScalar(currentThrottle * modeCfg.maxThrust);
            const accel = new THREE.Vector3().addVectors(thrust, new THREE.Vector3(0, -9.81, 0));
            drone.velocity.addScaledVector(drone.velocity, -modeCfg.drag);
            drone.velocity.addScaledVector(accel, dt);
            drone.position.addScaledVector(drone.velocity, dt);

            if (drone.position.y < 0.3) { drone.position.y = 0.3; drone.velocity.y = 0; }

            droneGroup.position.copy(drone.position);
            droneGroup.quaternion.copy(drone.rotation);
            if (currentThrottle > 0.05) propMeshes.forEach(prop => { prop.rotation.y += 0.55; });

            camera.position.copy(drone.position);
            camera.quaternion.copy(drone.rotation);

            mouseRoll = 0; mousePitch = 0;

            const speedKmh = (drone.velocity.length() * 3.6).toFixed(1);
            const heightVal = drone.position.y.toFixed(1);
            const distVal = Math.sqrt(drone.position.x * drone.position.x + drone.position.z * drone.position.z).toFixed(1);

            document.getElementById('tele-speed').innerHTML = `${speedKmh}km/h`;
            document.getElementById('tele-speed2').innerHTML = `${speedKmh}km/h`;
            document.getElementById('tele-height').innerHTML = `<span>H</span> ${heightVal}m`;
            document.getElementById('tele-dist').innerHTML = `<span>D</span> ${distVal}m`;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
