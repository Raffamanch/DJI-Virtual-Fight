<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FPV PC Simulator - Sunset Track & Realistic Shading</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #221229; font-family: monospace; position: fixed; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* OSD Canvas Overlay */
        #osd-overlay-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; pointer-events: none;
            image-rendering: pixelated;
        }

        /* RC Stick Controller Overlay (PC) - Rounded 5-8px soft box style */
        #rc-sticks-container {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 7;
            pointer-events: none;
        }
        .stick-box {
            width: 82px;
            height: 82px;
            background: rgba(20, 25, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 6px; /* Lightly rounded corner (around 5-8px) */
            position: relative;
            box-shadow: 0 5px 12px rgba(0,0,0,0.33);
            overflow: hidden;
        }
        .stick-cross-h {
            position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255, 255, 255, 0.3);
        }
        .stick-cross-v {
            position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255, 255, 255, 0.3);
        }
        .stick-ball {
            position: absolute; width: 16px; height: 16px; background: #ffffff; border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: transform 0.05s linear;
        }

        /* Touch Joysticks Overlay (Mobile Only) */
        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9;
            pointer-events: none;
            display: none;
        }
        .touch-pad {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 30px);
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #touch-left-pad { left: 20px; bottom: 20px; }
        #touch-right-pad { right: 20px; bottom: 20px; }
        
        .touch-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Top Action Bar & Home / RTH UI */
        #top-action-bar {
            position: absolute; top: max(15px, env(safe-area-inset-top)); right: 20px; display: flex; align-items: center; gap: 10px; z-index: 8; pointer-events: auto;
        }
        .top-btn {
            background: rgba(20, 25, 35, 0.75); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px; border-radius: 6px; font-family: monospace; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .top-btn:hover { background: rgba(40, 50, 70, 0.85); }
        .btn-icon { background: #ffffff; color: #111; font-size: 11px; font-weight: bold; padding: 1px 5px; border-radius: 4px; }
        
        #rth-btn { background: rgba(180, 40, 40, 0.8); border-color: rgba(255, 100, 100, 0.4); }
        #rth-btn.active { background: rgba(40, 180, 80, 0.85); border-color: rgba(100, 255, 140, 0.5); animation: pulseRth 1s infinite alternate; }
        @keyframes pulseRth { 0% { opacity: 0.8; } 100% { opacity: 1; transform: scale(1.05); } }

        /* Notification Toast for Home Point Updated */
        #notification-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 25, 35, 0.88);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: #00ffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            z-index: 12;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }
        #notification-toast.show {
            opacity: 1;
        }

        /* Top Menu Bar */
        #top-menu-bar { position: absolute; top: max(15px, env(safe-area-inset-top)); left: 20px; display: flex; align-items: center; gap: 10px; z-index: 8; pointer-events: auto; }
        #menu-dot-esc { color: #ffffff; font-size: 14px; background: rgba(20, 25, 35, 0.75); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        #mobile-mode-btn {
            color: #ffeb3b; font-size: 14px; background: rgba(20, 25, 35, 0.85); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,235,59,0.4); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: none; font-weight: bold;
        }

        /* MAIN MENU SCREEN */
        #instructions { position: absolute; width: 100%; height: 100%; background: rgba(10, 5, 15, 0.4); color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; z-index: 10; }
        #menu-content { background: rgba(28, 20, 36, 0.95); padding: 25px 30px; border: 1px solid rgba(255, 150, 200, 0.3); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); pointer-events: auto; max-width: 90%; }
        h1 { margin-bottom: 15px; font-size: 22px; letter-spacing: 1px; color: #ff9cf9; }
        p { line-height: 1.6; font-size: 14px; color: #eee; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <!-- Notification Toast -->
        <div id="notification-toast">Home point updated.</div>

        <div id="top-menu-bar">
            <div id="menu-dot-esc">HOME &bull; RTH</div>
            <div id="mobile-mode-btn">MODE: NORMAL</div>
        </div>

        <div id="top-action-bar">
            <button class="top-btn" id="rth-btn">RTH <span class="btn-icon" style="background:#ff6b6b; color:#fff;">OFF</span></button>
            <button class="top-btn" id="btn-switch-view">View <span class="btn-icon">C</span></button>
            <button class="top-btn" id="btn-retry">Reset <span class="btn-icon">R</span></button>
            <button class="top-btn" id="btn-pause">Pause <span class="btn-icon" id="pause-icon">ESC</span></button>
        </div>

        <canvas id="osd-overlay-canvas"></canvas>

        <!-- RC Sticks Overlay (PC) - Lightly Rounded Corners (6px) -->
        <div id="rc-sticks-container">
            <div class="stick-box">
                <div class="stick-cross-h"></div>
                <div class="stick-cross-v"></div>
                <div id="stick-left" class="stick-ball"></div>
            </div>
            <div class="stick-box">
                <div class="stick-cross-h"></div>
                <div class="stick-cross-v"></div>
                <div id="stick-right" class="stick-ball"></div>
            </div>
        </div>

        <!-- Touch Controls (Mobile) -->
        <div id="touch-controls">
            <div id="touch-left-pad" class="touch-pad">
                <div id="touch-left-knob" class="touch-knob"></div>
            </div>
            <div id="touch-right-pad" class="touch-pad">
                <div id="touch-right-knob" class="touch-knob"></div>
            </div>
        </div>

        <div id="instructions">
            <div id="menu-content">
                <h1>VelociDrone Sunset Edition</h1>
                <p id="instruction-text">
                    <b>[ CLICK TO START / PLAY ]</b><br><br>
                    <b>[ W / S ]</b> : THROTTLE | <b>[ A / D ]</b> : YAW<br>
                    <b>[ Move Mouse ]</b> : PITCH & ROLL | <b>[ R ]</b> : Reset Drone<br>
                    <b>[ Click RTH Button ]</b> : Auto-Return to Home (H Point)<br><br>
                    <span style="color: #ff9cf9;">✓ FOV 135° Wide View & Pink-Blue Sunset Shading Active</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('mobile-mode-btn').style.display = 'block';
            document.getElementById('pause-icon').innerText = 'II';
            document.getElementById('instruction-text').innerHTML = `
                <b>[ TAP TO START SIMULATOR ]</b><br><br>
                <b>[ Left Joystick ]</b> : Throttle & Yaw<br>
                <b>[ Right Joystick ]</b> : Pitch & Roll<br>
                <b>[ Tap RTH Button ]</b> : Auto-Return to Home Point<br><br>
                <span style="color: #ff9cf9;">✓ FOV 135° & Sunset Shading Active</span>
            `;
        }

        // Toast Notification System
        let toastTimeout = null;
        function showNotification(text) {
            const toast = document.getElementById('notification-toast');
            toast.innerText = text;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        const osdCanvas = document.getElementById('osd-overlay-canvas');
        const oCtx = osdCanvas.getContext('2d', { willReadFrequently: true });
        const osdImg = new Image();
        osdImg.src = 'hd.jpeg';

        function resizeOSD() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            osdCanvas.width = width;
            osdCanvas.height = height;
            if (osdImg.complete) {
                renderProcessedOSD();
            }
        }

        function renderProcessedOSD() {
            oCtx.clearRect(0, 0, osdCanvas.width, osdCanvas.height);
            oCtx.drawImage(osdImg, 0, 0, osdCanvas.width, osdCanvas.height);
            
            const imgData = oCtx.getImageData(0, 0, osdCanvas.width, osdCanvas.height);
            const data = imgData.data;
            const width = osdCanvas.width;
            const height = osdCanvas.height;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                if (r < 55 && g < 55 && b < 55) {
                    data[i+3] = 0;
                } else {
                    let brightness = (r + g + b) / 3;
                    if (brightness > 60) {
                        data[i]   = Math.min(255, r * 1.2);
                        data[i+1] = Math.min(255, g * 1.2);
                        data[i+2] = Math.min(255, b * 1.3);
                        data[i+3] = 255;
                    } else {
                        data[i+3] = 0;
                    }
                }
            }

            const tempData = new Uint8ClampedArray(data);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let idx = (y * width + x) * 4;
                    if (data[idx + 3] === 0) {
                        let solidNeighbors = 0;
                        if (tempData[((y-1) * width + x) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[((y+1) * width + x) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[(y * width + (x-1)) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[(y * width + (x+1)) * 4 + 3] > 128) solidNeighbors++;
                        if (solidNeighbors === 0) {
                            data[idx + 3] = 0;
                        }
                    }
                }
            }

            oCtx.putImageData(imgData, 0, 0);
        }

        osdImg.onload = () => { resizeOSD(); };

        const container = document.getElementById('canvas-container');
        const inst = document.getElementById('instructions');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x321838);
        scene.fog = new THREE.FogExp2(0x52294f, 0.0016);

        const camera = new THREE.PerspectiveCamera(135, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            resizeOSD();
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => { setTimeout(handleResize, 300); });
        setTimeout(handleResize, 100);

        scene.add(new THREE.AmbientLight(0xd47bc2, 0.65));
        const sunLight = new THREE.DirectionalLight(0xffb366, 1.2);
        sunLight.position.set(250, 120, -300);
        scene.add(sunLight);

        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256; floorCanvas.height = 256;
        const ctxFloor = floorCanvas.getContext('2d');
        ctxFloor.fillStyle = '#30243b'; ctxFloor.fillRect(0, 0, 256, 256);
        for(let i=0; i<800; i++) {
            ctxFloor.fillStyle = i % 2 === 0 ? '#3d2b45' : '#271c30';
            ctxFloor.fillRect(Math.random()*256, Math.random()*256, 3, 3);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(180, 180);

        const floorGeo = new THREE.PlaneGeometry(5000, 5000);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8, metalness: 0.1 });
        scene.add(new THREE.Mesh(floorGeo, floorMat));

        const homeGroup = new THREE.Group();
        const homePos = new THREE.Vector3(0, 0.05, 45);
        homeGroup.position.copy(homePos);

        const ringGeo = new THREE.RingGeometry(2.2, 2.6, 32);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);

        const ringGeo2 = new THREE.RingGeometry(1.0, 1.3, 32);
        ringGeo2.rotateX(-Math.PI / 2);
        const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat);

        const padDiscGeo = new THREE.CircleGeometry(2.2, 32);
        padDiscGeo.rotateX(-Math.PI / 2);
        const padDiscMat = new THREE.MeshBasicMaterial({ color: 0x002233, transparent: true, opacity: 0.6 });
        const padDisc = new THREE.Mesh(padDiscGeo, padDiscMat);

        const hGroup = new THREE.Group();
        const hBarMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 2.0), hBarMat); leftLeg.position.set(-0.7, 0.03, 0);
        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 2.0), hBarMat); rightLeg.position.set(0.7, 0.03, 0);
        const crossBar = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.5), hBarMat); crossBar.position.set(0, 0.03, 0);
        hGroup.add(leftLeg, rightLeg, crossBar);

        homeGroup.add(padDisc, ringMesh, ringMesh2, hGroup);
        scene.add(homeGroup);

        const cloudGroup = new THREE.Group();
        const cloudCanvas = document.createElement('canvas');
        cloudCanvas.width = 128; cloudCanvas.height = 128;
        const ctxCloud = cloudCanvas.getContext('2d');
        let grad = ctxCloud.createRadialGradient(64,64,10, 64,64,55);
        grad.addColorStop(0, 'rgba(255, 150, 200, 0.85)');
        grad.addColorStop(0.5, 'rgba(120, 140, 255, 0.5)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctxCloud.fillStyle = grad; ctxCloud.fillRect(0,0,128,128);
        const cloudTex = new THREE.CanvasTexture(cloudCanvas);

        const cloudSpriteMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
        for(let c=0; c<50; c++) {
            const sprite = new THREE.Sprite(cloudSpriteMat);
            sprite.position.set((Math.random()-0.5)*1400, 190 + Math.random()*80, (Math.random()-0.5)*1400);
            sprite.scale.set(150 + Math.random()*120, 60 + Math.random()*50, 1);
            cloudGroup.add(sprite);
        }
        scene.add(cloudGroup);

        const obstacles = [];
        const blockCanvas = document.createElement('canvas');
        blockCanvas.width = 64; blockCanvas.height = 64;
        const ctxBlock = blockCanvas.getContext('2d');
        ctxBlock.fillStyle = '#423352'; ctxBlock.fillRect(0,0,64,64);
        ctxBlock.fillStyle = '#544266'; ctxBlock.fillRect(2,2,60,60);
        const blockTex = new THREE.CanvasTexture(blockCanvas);
        blockTex.wrapS = THREE.RepeatWrapping; blockTex.wrapT = THREE.RepeatWrapping;
        blockTex.repeat.set(2, 8);

        const wallMat = new THREE.MeshStandardMaterial({ map: blockTex, roughness: 0.5 });
        const gateMat = new THREE.MeshStandardMaterial({ color: 0xff477e, emissive: 0x551122, roughness: 0.3 });

        function createTrackTower(x, z, width, height, depth) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            mesh.position.set(x, height / 2, z);
            scene.add(mesh);
            obstacles.push({ minX: x - width/2, maxX: x + width/2, minZ: z - depth/2, maxZ: z + depth/2, minY: 0, maxY: height });
        }

        function createVelociGate(x, z, rotY) {
            const gateGroup = new THREE.Group(); const gateW = 15, gateH = 11, thick = 0.7;
            const top = new THREE.Mesh(new THREE.BoxGeometry(gateW, thick, thick), gateMat); top.position.y = gateH;
            const left = new THREE.Mesh(new THREE.BoxGeometry(thick, gateH, thick), gateMat); left.position.set(-gateW/2, gateH/2, 0);
            const right = new THREE.Mesh(new THREE.BoxGeometry(thick, gateH, thick), gateMat); right.position.set(gateW/2, gateH/2, 0);
            gateGroup.add(top, left, right); gateGroup.position.set(x, 0, z); gateGroup.rotation.y = rotY; scene.add(gateGroup);

            const isRotated = Math.abs(rotY) > 0.1; const sizeX = isRotated ? thick : gateW; const sizeZ = isRotated ? gateW : thick;
            const lx = x + (isRotated ? 0 : -gateW/2); const lz = z + (isRotated ? -gateW/2 : 0);
            obstacles.push({ minX: lx - 0.5, maxX: lx + 0.5, minZ: lz - 0.5, maxZ: lz + 0.5, minY: 0, maxY: gateH });
            const rx = x + (isRotated ? 0 : gateW/2); const rz = z + (isRotated ? gateW/2 : 0);
            obstacles.push({ minX: rx - 0.5, maxX: rx + 0.5, minZ: rz - 0.5, maxZ: rz + 0.5, minY: 0, maxY: gateH });
            obstacles.push({ minX: x - sizeX/2, maxX: x + sizeX/2, minZ: z - sizeZ/2, maxZ: z + sizeZ/2, minY: gateH - 0.4, maxY: gateH + 0.4 });
        }

        createTrackTower(-60, -100, 30, 70, 30);
        createTrackTower(70, -120, 35, 90, 35);
        createTrackTower(-90, 20, 25, 55, 25);
        createTrackTower(80, 40, 30, 65, 30);

        createVelociGate(0, -20, 0);
        createVelociGate(-35, -60, Math.PI / 4);
        createVelociGate(35, -60, -Math.PI / 4);
        createVelociGate(0, -120, 0);
        createVelociGate(-50, -170, Math.PI / 2);
        createVelociGate(50, -170, Math.PI / 2);
        createVelociGate(0, -240, 0);

        const droneGroup = new THREE.Group();
        const coreGeo = new THREE.BoxGeometry(1.2, 0.4, 1.8);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
        droneGroup.add(new THREE.Mesh(coreGeo, coreMat));

        const armMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5 });
        const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 3.2), armMat); arm1.rotation.y = Math.PI / 4;
        const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 3.2), armMat); arm2.rotation.y = -Math.PI / 4;
        droneGroup.add(arm1, arm2);

        const propMat = new THREE.MeshStandardMaterial({ color: 0xff6bcb, emissive: 0x441122 });
        const offsets = [{x:1.1, z:1.1}, {x:-1.1, z:1.1}, {x:1.1, z:-1.1}, {x:-1.1, z:-1.1}];
        const propMeshes = [];

        offsets.forEach(pos => {
            const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.3), armMat); motor.position.set(pos.x, 0.2, pos.z);
            const prop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.02, 0.15), propMat); prop.position.set(pos.x, 0.35, pos.z);
            droneGroup.add(motor, prop); propMeshes.push(prop);
        });
        scene.add(droneGroup);

        const drone = {
            position: new THREE.Vector3(0, 0.3, 45), 
            velocity: new THREE.Vector3(0, 0, 0),
            rotation: new THREE.Quaternion(),
            euler: new THREE.Euler(0, 0, 0, 'YXZ')
        };

        const MODES = {
            1: { name: "NORMAL", maxThrust: 14.0, drag: 0.040, hasAutoLevel: true, maxAngle: 0.5 },
            2: { name: "SPORT",  maxThrust: 21.0, drag: 0.025, hasAutoLevel: true, maxAngle: 0.8 },
            3: { name: "MANUAL", maxThrust: 25.5, drag: 0.022, hasAutoLevel: false },
            4: { name: "ACRO",   maxThrust: 25.5, drag: 0.009, hasAutoLevel: false }
        };
        let activeMode = 1;
        let cameraMode = "FPV";

        let isRthActive = false;
        let tumbleRotationVelocity = new THREE.Vector3(0, 0, 0);
        let isSpawnedSafe = true; 

        let keys = { w: false, s: false, a: false, d: false };
        let mouseRoll = 0, mousePitch = 0;
        let rawMouseX = 0, rawMouseY = 0;

        let touchLeftValX = 0, touchLeftValY = 0;
        let touchRightValX = 0, touchRightValY = 0;

        const MOUSE_SENSITIVITY = 0.0025; 
        const THROTTLE_SPEED = 4.0;
        const YAW_RATE = 3.5;
        const GRAVITY = 9.81;
        const CAMERA_UPTILT = 28 * (Math.PI / 180);

        let currentThrottle = 0;

        function startGameSession() {
            handleResize();
            inst.style.display = 'none';
            showNotification("Home point updated.");
            if (!isMobile) {
                container.requestPointerLock();
            }
        }
        container.addEventListener('click', startGameSession);
        inst.addEventListener('click', startGameSession);

        document.addEventListener('pointerlockchange', () => { 
            if (!isMobile) {
                const isLocked = (document.pointerLockElement === container);
                inst.style.display = isLocked ? 'none' : 'flex';
                if (!isLocked) { rawMouseX = 0; rawMouseY = 0; }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (['1','2','3','4'].includes(e.key)) {
                activeMode = parseInt(e.key);
                updateMobileModeButtonText();
                return;
            }
            if (e.key.toLowerCase() === 'c') { cameraMode = (cameraMode === "FPV") ? "TPV" : "FPV"; return; }
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === 'r') resetDrone();
        });
        document.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if (key in keys) keys[key] = false; });
        document.addEventListener('mousemove', (e) => {
            if (isMobile || document.pointerLockElement !== container || isRthActive) return;
            mouseRoll = e.movementX * MOUSE_SENSITIVITY;
            mousePitch = -e.movementY * MOUSE_SENSITIVITY;
            
            rawMouseX += e.movementX * 0.4;
            rawMouseY += e.movementY * 0.4;
            rawMouseX = Math.max(-25, Math.min(25, rawMouseX));
            rawMouseY = Math.max(-25, Math.min(25, rawMouseY));
        });

        function updateMobileModeButtonText() {
            const btn = document.getElementById('mobile-mode-btn');
            if (btn) { btn.innerText = `MODE: ${MODES[activeMode].name}`; }
        }

        document.getElementById('mobile-mode-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            activeMode = (activeMode % 4) + 1;
            updateMobileModeButtonText();
        });

        const rthBtn = document.getElementById('rth-btn');
        rthBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isRthActive = !isRthActive;
            if (isRthActive) {
                rthBtn.classList.add('active');
                rthBtn.querySelector('.btn-icon').innerText = 'ON';
                rthBtn.querySelector('.btn-icon').style.background = '#28a745';
            } else {
                rthBtn.classList.remove('active');
                rthBtn.querySelector('.btn-icon').innerText = 'OFF';
                rthBtn.querySelector('.btn-icon').style.background = '#ff6b6b';
            }
        });

        function setupTouchJoystick(padId, knobId, callback) {
            const pad = document.getElementById(padId);
            const knob = document.getElementById(knobId);
            const maxDist = 45;
            let activeTouchId = null;

            pad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId === null && !isRthActive) {
                    const touch = e.changedTouches[0];
                    activeTouchId = touch.identifier;
                    updateStick(touch);
                }
            }, { passive: false });

            pad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (isRthActive) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        updateStick(touch);
                    }
                }
            }, { passive: false });

            function endTouch(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        knob.style.transform = `translate(-50%, -50%)`;
                        callback(0, 0);
                    }
                }
            }
            pad.addEventListener('touchend', endTouch);
            pad.addEventListener('touchcancel', endTouch);

            function updateStick(touch) {
                const rect = pad.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                callback(dx / maxDist, dy / maxDist);
            }
        }

        if (isMobile) {
            setupTouchJoystick('touch-left-pad', 'touch-left-knob', (x, y) => { touchLeftValX = x; touchLeftValY = y; });
            setupTouchJoystick('touch-right-pad', 'touch-right-knob', (x, y) => { touchRightValX = x; touchRightValY = y; });
        }

        document.getElementById('btn-switch-view').addEventListener('click', (e) => {
            e.stopPropagation();
            cameraMode = (cameraMode === "FPV") ? "TPV" : "FPV";
        });
        document.getElementById('btn-retry').addEventListener('click', (e) => {
            e.stopPropagation();
            resetDrone();
        });
        document.getElementById('btn-pause').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isMobile) document.exitPointerLock();
            inst.style.display = 'flex';
        });

        function resetDrone() {
            drone.position.set(0, 0.3, 45); drone.velocity.set(0, 0, 0); drone.rotation.set(0, 0, 0, 1); drone.euler.set(0, 0, 0);
            currentThrottle = 0; tumbleRotationVelocity.set(0, 0, 0);
            isSpawnedSafe = true; rawMouseX = 0; rawMouseY = 0;
            touchLeftValX = 0; touchLeftValY = 0; touchRightValX = 0; touchRightValY = 0;
            isRthActive = false;
            rthBtn.classList.remove('active');
            rthBtn.querySelector('.btn-icon').innerText = 'OFF';
            rthBtn.querySelector('.btn-icon').style.background = '#ff6b6b';
            showNotification("Home point updated.");
            handleResize();
        }

        function handleCollisions() {
            const px = drone.position.x; const py = drone.position.y; const pz = drone.position.z; 
            const buffer = 0.8; 

            for(let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if(px + buffer > obs.minX && px - buffer < obs.maxX && pz + buffer > obs.minZ && pz - buffer < obs.maxZ) {
                    if(py + buffer > obs.minY && py - buffer < obs.maxY) {
                        let overlapX = Math.min(obs.maxX - (px - buffer), (px + buffer) - obs.minX);
                        let overlapZ = Math.min(obs.maxZ - (pz - buffer), (pz + buffer) - obs.minZ);
                        let speedH = Math.sqrt(drone.velocity.x * drone.velocity.x + drone.velocity.z * drone.velocity.z);

                        if (overlapX < overlapZ) {
                            drone.position.x += (px > (obs.minX + obs.maxX)/2) ? overlapX : -overlapX;
                            drone.velocity.x *= -0.4;
                        } else {
                            drone.position.z += (pz > (obs.minZ + obs.maxZ)/2) ? overlapZ : -overlapZ;
                            drone.velocity.z *= -0.4;
                        }

                        if (speedH > 4.5) {
                            tumbleRotationVelocity.set((Math.random() - 0.5) * 60.0, (Math.random() - 0.5) * 40.0, (Math.random() - 0.5) * 60.0);
                            drone.velocity.y = speedH * 0.45 + 2.5; 
                        } else {
                            drone.velocity.y = 2.8; 
                            tumbleRotationVelocity.set((Math.random()-0.5)*9, (Math.random()-0.5)*9, (Math.random()-0.5)*9);
                        }
                    }
                }
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta(); if (dt > 0.1) dt = 0.1;
            const modeCfg = MODES[activeMode];

            let inputYaw = 0;

            if (isRthActive) {
                const targetPos = homePos.clone();
                targetPos.y = 12.0;
                const dirToHome = new THREE.Vector3().subVectors(targetPos, drone.position);
                const distToHome = dirToHome.length();

                if (distToHome < 1.5 && drone.position.y <= 1.0) {
                    isRthActive = false;
                    rthBtn.classList.remove('active');
                    rthBtn.querySelector('.btn-icon').innerText = 'OFF';
                    rthBtn.querySelector('.btn-icon').style.background = '#ff6b6b';
                    drone.velocity.set(0,0,0);
                    currentThrottle = 0;
                } else {
                    dirToHome.normalize();
                    currentThrottle = 0.65;
                    const targetQuaternion = new THREE.Quaternion();
                    const mLook = new THREE.Matrix4().lookAt(drone.position, targetPos, new THREE.Vector3(0,1,0));
                    targetQuaternion.setFromRotationMatrix(mLook);
                    drone.rotation.slerp(targetQuaternion, 4.0 * dt);
                }
            } else if (isMobile) {
                const targetThrottle = (-touchLeftValY + 1) / 2;
                currentThrottle = targetThrottle;
                inputYaw = touchLeftValX * YAW_RATE * dt;

                const targetPitch = -touchRightValY * modeCfg.maxAngle;
                const targetRoll = touchRightValX * modeCfg.maxAngle;

                if (modeCfg.hasAutoLevel) {
                    drone.euler.y -= inputYaw;
                    drone.euler.x = targetPitch;
                    drone.euler.z = targetRoll;
                    drone.rotation.setFromEuler(drone.euler);
                } else {
                    const deltaRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(-touchRightValY * 2.0 * dt, -inputYaw, -touchRightValX * 2.0 * dt, 'YXZ'));
                    drone.rotation.multiply(deltaRotation).normalize();
                }
            } else {
                if (document.pointerLockElement === container) {
                    if (keys.w) currentThrottle = Math.min(1.0, currentThrottle + THROTTLE_SPEED * dt);
                    if (keys.s) currentThrottle = Math.max(0.0, currentThrottle - THROTTLE_SPEED * dt);
                    if (keys.a) inputYaw = -YAW_RATE * dt;
                    if (keys.d) inputYaw = YAW_RATE * dt;

                    if (modeCfg.hasAutoLevel) {
                        drone.euler.y -= inputYaw;
                        drone.euler.x = THREE.MathUtils.clamp(drone.euler.x + mousePitch, -modeCfg.maxAngle, modeCfg.maxAngle);
                        drone.euler.z = THREE.MathUtils.clamp(drone.euler.z - mouseRoll, -modeCfg.maxAngle, modeCfg.maxAngle);
                        if (Math.abs(mousePitch) < 0.001) drone.euler.x *= Math.exp(-6.0 * dt);
                        if (Math.abs(mouseRoll) < 0.001) drone.euler.z *= Math.exp(-6.0 * dt);
                        drone.rotation.setFromEuler(drone.euler);
                    } else {
                        const deltaRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(mousePitch, -inputYaw, -mouseRoll, 'YXZ'));
                        drone.rotation.multiply(deltaRotation).normalize();
                    }
                } else {
                    rawMouseX *= Math.exp(-10.0 * dt);
                    rawMouseY *= Math.exp(-10.0 * dt);
                }
            }

            if (drone.position.y > 1.5) { isSpawnedSafe = false; }

            if (tumbleRotationVelocity.lengthSq() > 0.001) {
                const tumbleQuaternion = new THREE.Quaternion().setFromEuler(
                    new THREE.Euler(tumbleRotationVelocity.z * dt, tumbleRotationVelocity.y * dt, tumbleRotationVelocity.x * dt, 'YXZ')
                );
                drone.rotation.multiply(tumbleQuaternion).normalize();
                tumbleRotationVelocity.multiplyScalar(Math.exp(-2.4 * dt)); 
                if (modeCfg.hasAutoLevel && tumbleRotationVelocity.lengthSq() < 0.4) { 
                    drone.euler.setFromQuaternion(drone.rotation, 'YXZ'); 
                }
            }

            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(drone.rotation);
            const thrust = localUp.multiplyScalar(currentThrottle * modeCfg.maxThrust);
            const gravityForce = new THREE.Vector3(0, -GRAVITY, 0);

            const accel = new THREE.Vector3().addVectors(thrust, gravityForce);
            drone.velocity.addScaledVector(drone.velocity, -modeCfg.drag);
            drone.velocity.addScaledVector(accel, dt);
            drone.position.addScaledVector(drone.velocity, dt);

            if (drone.position.y < 0.3) {
                drone.position.y = 0.3; 
                if (!isSpawnedSafe && Math.abs(drone.velocity.y) > 3.0) {
                    tumbleRotationVelocity.set((Math.random()-0.5)*45, (Math.random()-0.5)*25, (Math.random()-0.5)*45);
                    drone.velocity.y = Math.abs(drone.velocity.y) * 0.38 + 1.2;
                } else if (!isSpawnedSafe && Math.abs(drone.velocity.y) > 0.5) {
                    drone.velocity.y = 1.8;
                    tumbleRotationVelocity.set((Math.random()-0.5)*6, (Math.random()-0.5)*6, (Math.random()-0.5)*6);
                } else {
                    drone.velocity.y = 0;
                }
                drone.velocity.x *= 0.65; drone.velocity.z *= 0.65;
                if(modeCfg.hasAutoLevel && tumbleRotationVelocity.lengthSq() < 0.2) { 
                    drone.euler.x = 0; drone.euler.z = 0; drone.rotation.setFromEuler(drone.euler); 
                }
            }

            handleCollisions();

            droneGroup.position.copy(drone.position);
            droneGroup.quaternion.copy(drone.rotation);

            if (currentThrottle > 0.05) { propMeshes.forEach(prop => { prop.rotation.y += 0.55; }); }

            cloudGroup.children.forEach(c => {
                c.position.x += 1.5 * dt;
                if(c.position.x > 700) c.position.x = -700;
            });

            if (cameraMode === "FPV") {
                camera.position.copy(drone.position);
                const camRot = drone.rotation.clone();
                camRot.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), CAMERA_UPTILT));
                camera.quaternion.copy(camRot);
                droneGroup.visible = false;
            } else {
                droneGroup.visible = true;
                const backOffset = new THREE.Vector3(0, 2.5, 7.5).applyQuaternion(drone.rotation);
                camera.position.lerp(new THREE.Vector3().subVectors(drone.position, backOffset), 0.2);
                camera.lookAt(drone.position);
            }

            mouseRoll = 0; mousePitch = 0;

            const stickLeft = document.getElementById('stick-left');
            const stickRight = document.getElementById('stick-right');
            let leftY, leftX, rightX, rightY;

            if (isMobile) {
                leftY = touchLeftValY * 35;
                leftX = touchLeftValX * 35;
                rightX = touchRightValX * 35;
                rightY = touchRightValY * 35;
            } else {
                leftY = (currentThrottle - 0.5) * -55; 
                leftX = (keys.d ? 1 : (keys.a ? -1 : 0)) * 24;
                rightX = rawMouseX;
                rightY = rawMouseY;
            }
            stickLeft.style.transform = `translate(calc(-50% + ${leftX}px), calc(-50% + ${leftY}px))`;
            stickRight.style.transform = `translate(calc(-50% + ${rightX}px), calc(-50% + ${rightY}px))`;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
